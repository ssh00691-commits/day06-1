<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방명록</title>
<style>
  :root {
    --bg: #141416;
    --card: #1d1d21;
    --line: #f2f2f2;
    --text: #f2f2f2;
    --muted: #9a9aa2;
    --border: #3a3a40;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
  .hero {
    position: relative;
    height: 240px;
    background: url("pheladii-dad-9513646_1920.jpg") center 78% / cover no-repeat;
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(20,20,22,0) 55%, var(--bg));
  }
  .hero h1 {
    position: absolute; z-index: 1; left: 16px; top: 16px; margin: 0;
    font-size: 1.5rem; font-weight: 600; letter-spacing: 0.04em;
  }
  main { padding: 0 16px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  input, textarea {
    width: 100%;
    padding: 14px;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:focus, textarea:focus { outline: none; border-color: var(--line); }
  textarea { min-height: 96px; resize: vertical; }
  button {
    min-height: 48px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--bg);
    background: var(--line);
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }
  button:active { opacity: 0.8; }
  #status { min-height: 1.4em; margin: 10px 2px 0; color: #ff9a9a; font-size: 0.9rem; }
  #list { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  #list li {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  #list strong { display: block; font-size: 1rem; }
  #list .msg { display: block; margin-top: 4px; }
  #list small { display: block; margin-top: 8px; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>방명록</h1></div>
  <main>

  <form id="form">
    <input id="name" type="text" placeholder="이름" maxlength="30">
    <textarea id="message" placeholder="한 줄 인사" maxlength="200"></textarea>
    <button type="submit">남기기</button>
  </form>
  <p id="status"></p>

  <ul id="list"></ul>
  </main>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://bpzwirparqtrcvsxvmee.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vhDv5QqeDfyugisuE5AQVg_RMiRLxj4';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('form');
    const nameInput = document.getElementById('name');
    const messageInput = document.getElementById('message');
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');

    function formatTime(iso) {
      return new Date(iso).toLocaleString('ko-KR');
    }

    async function loadList() {
      const { data, error } = await db
        .from('guestbook')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) {
        statusEl.textContent = '목록을 불러오지 못했어요.';
        return;
      }
      listEl.replaceChildren();
      for (const row of data) {
        const li = document.createElement('li');
        const who = document.createElement('strong');
        who.textContent = row.name;
        const msg = document.createElement('span');
        msg.className = 'msg';
        msg.textContent = row.message;
        const time = document.createElement('small');
        time.textContent = formatTime(row.created_at);
        li.append(who, msg, time);
        listEl.append(li);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const message = messageInput.value.trim();
      if (!name || !message) {
        statusEl.textContent = '이름과 글을 모두 입력해 주세요.';
        return;
      }
      const { error } = await db.from('guestbook').insert({ name, message });
      if (error) {
        statusEl.textContent = '저장하지 못했어요. 다시 시도해 주세요.';
        return;
      }
      statusEl.textContent = '';
      nameInput.value = '';
      messageInput.value = '';
      loadList();
    });

    loadList();
  </script>
</body>
</html>
